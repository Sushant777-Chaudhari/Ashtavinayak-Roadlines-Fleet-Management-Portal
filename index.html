<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashtavinayak Roadlines — Fleet Management Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #111420;
    --surface2: #181d2e;
    --border: #232840;
    --accent: #f4900c;
    --accent2: #e05c00;
    --blue: #2563eb;
    --green: #16a34a;
    --red: #dc2626;
    --yellow: #ca8a04;
    --text: #e8eaf0;
    --muted: #6b7280;
    --card: #13172299;
    --glow: rgba(244,144,12,0.18);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; overflow-x:hidden; }

  /* ─── SCROLLBAR ─── */
  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--accent); border-radius:3px; }

  /* ─── LOGIN SCREEN ─── */
  #loginScreen {
    position:fixed; inset:0; z-index:1000;
    background:radial-gradient(ellipse at 30% 40%, #1a2340 0%, #0a0c10 70%);
    display:flex; align-items:center; justify-content:center;
  }
  .login-bg-grid {
    position:absolute; inset:0; opacity:.07;
    background-image: repeating-linear-gradient(0deg,#f4900c 0,#f4900c 1px,transparent 1px,transparent 60px),
      repeating-linear-gradient(90deg,#f4900c 0,#f4900c 1px,transparent 1px,transparent 60px);
  }
  .login-truck-art {
    position:absolute; bottom:0; right:0; opacity:.06;
    font-size:320px; line-height:1; color:var(--accent);
    pointer-events:none;
  }
  .login-card {
    position:relative; z-index:2;
    background:var(--surface); border:1px solid var(--border);
    border-radius:20px; padding:44px 48px; width:420px;
    box-shadow: 0 0 60px rgba(244,144,12,.12), 0 24px 60px rgba(0,0,0,.5);
    animation: fadeUp .6s ease;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:none} }
  .login-logo { display:flex; align-items:center; gap:12px; margin-bottom:32px; }
  .login-logo-icon {
    width:52px; height:52px; background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:14px; display:flex; align-items:center; justify-content:center;
    font-size:26px; box-shadow:0 0 20px var(--glow);
  }
  .login-logo-text h1 { font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700; letter-spacing:.5px; }
  .login-logo-text span { font-size:11px; color:var(--muted); letter-spacing:2px; text-transform:uppercase; }
  .login-title { font-family:'Rajdhani',sans-serif; font-size:28px; font-weight:700; margin-bottom:6px; }
  .login-sub { font-size:13px; color:var(--muted); margin-bottom:28px; }
  .role-tabs { display:flex; gap:8px; margin-bottom:24px; background:var(--bg); border-radius:10px; padding:4px; }
  .role-tab {
    flex:1; padding:9px; border:none; background:transparent; color:var(--muted);
    border-radius:8px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13px;
    font-weight:500; transition:.2s; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .role-tab.active { background:var(--accent); color:#fff; box-shadow:0 0 16px var(--glow); }
  .form-group { margin-bottom:18px; }
  .form-label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:7px; display:block; }
  .form-input {
    width:100%; padding:12px 16px; background:var(--bg); border:1px solid var(--border);
    border-radius:10px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px;
    outline:none; transition:.2s;
  }
  .form-input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); }
  .btn-login {
    width:100%; padding:14px; background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none; border-radius:10px; color:#fff; font-family:'Rajdhani',sans-serif;
    font-size:17px; font-weight:700; cursor:pointer; letter-spacing:1px;
    transition:.2s; box-shadow:0 4px 20px var(--glow);
  }
  .btn-login:hover { transform:translateY(-1px); box-shadow:0 8px 30px var(--glow); }
  .login-hint { text-align:center; margin-top:16px; font-size:12px; color:var(--muted); }

  /* ─── MAIN APP ─── */
  #app { display:none; flex-direction:column; min-height:100vh; }

  /* ─── TOPBAR ─── */
  .topbar {
    position:sticky; top:0; z-index:100;
    background:rgba(17,20,32,.95); backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
    display:flex; align-items:center; padding:0 28px; height:64px; gap:20px;
  }
  .topbar-logo { display:flex; align-items:center; gap:10px; text-decoration:none; }
  .topbar-logo-icon {
    width:38px; height:38px; background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:10px; display:flex; align-items:center; justify-content:center;
    font-size:18px; box-shadow:0 0 14px var(--glow);
  }
  .topbar-logo-text { font-family:'Rajdhani',sans-serif; font-size:17px; font-weight:700; color:var(--text); }
  .topbar-logo-text span { color:var(--accent); }
  .topbar-nav { display:flex; gap:4px; margin-left:28px; flex:1; }
  .nav-btn {
    padding:8px 14px; border:none; background:transparent; color:var(--muted);
    border-radius:8px; cursor:pointer; font-family:'DM Sans',sans-serif; font-size:13px;
    font-weight:500; display:flex; align-items:center; gap:6px; transition:.2s; white-space:nowrap;
  }
  .nav-btn:hover { background:var(--surface2); color:var(--text); }
  .nav-btn.active { background:var(--surface2); color:var(--accent); }
  .topbar-right { display:flex; align-items:center; gap:12px; margin-left:auto; }
  .badge-btn {
    position:relative; width:38px; height:38px; background:var(--surface2);
    border:1px solid var(--border); border-radius:10px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; color:var(--muted); transition:.2s; font-size:16px;
  }
  .badge-btn:hover { color:var(--accent); border-color:var(--accent); }
  .badge { position:absolute; top:-4px; right:-4px; width:18px; height:18px; background:var(--accent); border-radius:50%; font-size:10px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; }
  .user-chip {
    display:flex; align-items:center; gap:10px; padding:6px 14px 6px 6px;
    background:var(--surface2); border:1px solid var(--border); border-radius:10px; cursor:pointer;
  }
  .user-avatar {
    width:30px; height:30px; border-radius:8px; background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff;
  }
  .user-info .user-name { font-size:13px; font-weight:600; }
  .user-info .user-role { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.8px; }

  /* ─── LAYOUT ─── */
  .app-body { display:flex; flex:1; }
  .sidebar {
    width:220px; min-height:calc(100vh - 64px); background:var(--surface);
    border-right:1px solid var(--border); padding:20px 12px; display:flex; flex-direction:column; gap:4px;
  }
  .sidebar-section { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; padding:10px 10px 6px; margin-top:8px; }
  .sidebar-btn {
    display:flex; align-items:center; gap:10px; padding:10px 12px; border:none;
    background:transparent; color:var(--muted); border-radius:8px; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; text-align:left; transition:.2s; width:100%;
  }
  .sidebar-btn i { width:16px; text-align:center; }
  .sidebar-btn:hover { background:var(--surface2); color:var(--text); }
  .sidebar-btn.active { background:rgba(244,144,12,.15); color:var(--accent); }
  .sidebar-btn .s-count {
    margin-left:auto; background:var(--accent); color:#fff;
    font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px;
  }
  .main { flex:1; padding:28px; overflow:auto; }

  /* ─── PANELS ─── */
  .panel { display:none; animation:fadeUp .35s ease; }
  .panel.active { display:block; }

  /* ─── CARDS ─── */
  .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:28px; }
  .stat-card {
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:20px 22px; position:relative; overflow:hidden;
  }
  .stat-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
  }
  .stat-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:10px; }
  .stat-value { font-family:'Rajdhani',sans-serif; font-size:36px; font-weight:700; line-height:1; }
  .stat-sub { font-size:12px; color:var(--muted); margin-top:6px; }
  .stat-icon {
    position:absolute; right:18px; top:50%; transform:translateY(-50%);
    font-size:40px; opacity:.08; color:var(--accent);
  }

  /* ─── TABLE ─── */
  .section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .section-title { font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; }
  .section-actions { display:flex; gap:8px; }
  .btn {
    padding:9px 18px; border-radius:8px; border:none; cursor:pointer;
    font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; transition:.2s;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary { background:var(--accent); color:#fff; box-shadow:0 0 12px var(--glow); }
  .btn-primary:hover { background:var(--accent2); }
  .btn-ghost { background:var(--surface2); color:var(--muted); border:1px solid var(--border); }
  .btn-ghost:hover { color:var(--text); border-color:var(--accent); }
  .btn-sm { padding:6px 12px; font-size:12px; }

  .data-table { width:100%; border-collapse:separate; border-spacing:0; }
  .data-table th {
    text-align:left; padding:10px 14px; font-size:11px; color:var(--muted);
    text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid var(--border);
    background:var(--surface); font-weight:500;
  }
  .data-table th:first-child { border-radius:10px 0 0 0; }
  .data-table th:last-child { border-radius:0 10px 0 0; }
  .data-table td {
    padding:12px 14px; border-bottom:1px solid rgba(35,40,64,.5);
    font-size:13px; background:var(--surface);
  }
  .data-table tr:hover td { background:var(--surface2); }
  .data-table tr:last-child td { border-bottom:none; }
  .table-wrap { border-radius:12px; overflow:hidden; border:1px solid var(--border); }

  /* ─── STATUS PILLS ─── */
  .pill {
    display:inline-flex; align-items:center; gap:5px;
    padding:4px 10px; border-radius:20px; font-size:11px; font-weight:600;
  }
  .pill-green { background:rgba(22,163,74,.15); color:#4ade80; }
  .pill-orange { background:rgba(244,144,12,.15); color:var(--accent); }
  .pill-red { background:rgba(220,38,38,.15); color:#f87171; }
  .pill-blue { background:rgba(37,99,235,.15); color:#60a5fa; }
  .pill-gray { background:rgba(107,114,128,.15); color:var(--muted); }
  .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }

  /* ─── GPS MAP SECTION ─── */
  .map-container {
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    overflow:hidden; position:relative;
  }
  .map-topbar {
    display:flex; align-items:center; gap:12px; padding:14px 18px;
    border-bottom:1px solid var(--border); background:var(--surface2);
  }
  .map-area {
    height:420px; background:#0d1117; position:relative; overflow:hidden;
  }
  .map-grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(37,99,235,.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(37,99,235,.08) 1px, transparent 1px);
    background-size:40px 40px;
  }
  /* Fake road lines */
  .map-roads { position:absolute; inset:0; }
  .map-road {
    position:absolute; background:rgba(244,144,12,.15); border-radius:3px;
  }
  .truck-pin {
    position:absolute; cursor:pointer;
    animation:pinPulse 2s ease-in-out infinite;
  }
  @keyframes pinPulse {
    0%,100%{filter:drop-shadow(0 0 6px var(--accent))}
    50%{filter:drop-shadow(0 0 16px var(--accent))}
  }
  .truck-pin-inner {
    width:36px; height:36px; background:linear-gradient(135deg,var(--accent),var(--accent2));
    border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    display:flex; align-items:center; justify-content:center;
    border:3px solid #fff; box-shadow:0 4px 12px rgba(0,0,0,.4);
  }
  .truck-pin-inner i { transform:rotate(45deg); color:#fff; font-size:14px; }
  .truck-label {
    position:absolute; top:-30px; left:50%; transform:translateX(-50%);
    background:var(--surface); border:1px solid var(--accent); border-radius:6px;
    padding:3px 8px; font-size:10px; font-weight:600; color:var(--accent);
    white-space:nowrap;
  }
  .map-info-panel {
    position:absolute; right:16px; top:16px; bottom:16px; width:220px;
    background:rgba(17,20,32,.92); backdrop-filter:blur(10px);
    border:1px solid var(--border); border-radius:12px; padding:16px;
    overflow-y:auto; display:flex; flex-direction:column; gap:12px;
  }
  .map-truck-card {
    background:var(--surface2); border:1px solid var(--border); border-radius:8px;
    padding:12px; cursor:pointer; transition:.2s;
  }
  .map-truck-card:hover, .map-truck-card.selected { border-color:var(--accent); background:rgba(244,144,12,.08); }
  .map-truck-name { font-family:'Rajdhani',sans-serif; font-weight:700; font-size:15px; margin-bottom:4px; }
  .map-truck-detail { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px; margin-top:3px; }
  .wheels-eye-badge {
    display:inline-flex; align-items:center; gap:5px;
    background:rgba(37,99,235,.15); border:1px solid rgba(37,99,235,.3);
    color:#60a5fa; padding:3px 9px; border-radius:6px; font-size:10px; font-weight:600;
  }

  /* ─── TRIP CARD ─── */
  .trip-card {
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px; margin-bottom:14px; display:grid;
    grid-template-columns:auto 1fr auto; gap:16px; align-items:center;
  }
  .trip-no { font-family:'Bebas Neue',sans-serif; font-size:28px; color:var(--accent); line-height:1; }
  .trip-route { display:flex; align-items:center; gap:8px; font-size:15px; font-weight:600; margin-bottom:4px; }
  .trip-meta { font-size:12px; color:var(--muted); }
  .trip-progress { margin-top:10px; }
  .progress-bar { height:4px; background:var(--border); border-radius:2px; margin-top:4px; }
  .progress-fill { height:100%; border-radius:2px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .6s; }

  /* ─── MESSAGING ─── */
  .chat-layout { display:grid; grid-template-columns:260px 1fr; gap:0; height:560px; background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .chat-sidebar { border-right:1px solid var(--border); display:flex; flex-direction:column; }
  .chat-search { padding:12px; border-bottom:1px solid var(--border); }
  .chat-search input {
    width:100%; padding:9px 12px; background:var(--surface2); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-size:13px; outline:none;
  }
  .chat-list { overflow-y:auto; flex:1; }
  .chat-item {
    display:flex; align-items:center; gap:10px; padding:12px 14px;
    cursor:pointer; transition:.15s; border-bottom:1px solid rgba(35,40,64,.3);
  }
  .chat-item:hover, .chat-item.active { background:var(--surface2); }
  .chat-item.active { border-left:3px solid var(--accent); }
  .chat-avatar {
    width:38px; height:38px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:700; color:#fff;
  }
  .chat-avatar.driver { background:linear-gradient(135deg,#2563eb,#1d4ed8); }
  .chat-avatar.admin { background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  .chat-avatar.group { background:linear-gradient(135deg,#16a34a,#15803d); }
  .chat-name { font-size:13px; font-weight:600; }
  .chat-preview { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:140px; }
  .chat-time { font-size:10px; color:var(--muted); margin-left:auto; }
  .chat-main { display:flex; flex-direction:column; }
  .chat-header { padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px; background:var(--surface2); }
  .chat-messages { flex:1; padding:18px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; background:var(--bg); }
  .msg { max-width:70%; }
  .msg-out { align-self:flex-end; }
  .msg-in { align-self:flex-start; }
  .msg-bubble {
    padding:10px 14px; border-radius:12px; font-size:13px; line-height:1.5;
  }
  .msg-out .msg-bubble { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:#fff; border-radius:12px 12px 0 12px; }
  .msg-in .msg-bubble { background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:12px 12px 12px 0; }
  .msg-time { font-size:10px; color:var(--muted); margin-top:3px; text-align:right; }
  .chat-input-area { padding:14px; border-top:1px solid var(--border); display:flex; gap:10px; align-items:center; }
  .chat-input {
    flex:1; padding:10px 14px; background:var(--surface2); border:1px solid var(--border);
    border-radius:10px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:13px; outline:none;
  }
  .chat-input:focus { border-color:var(--accent); }
  .btn-send {
    width:40px; height:40px; background:linear-gradient(135deg,var(--accent),var(--accent2));
    border:none; border-radius:10px; cursor:pointer; color:#fff; font-size:16px; transition:.2s;
  }
  .btn-send:hover { transform:scale(1.08); }

  /* ─── FORM / MODAL ─── */
  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:500;
    display:none; align-items:center; justify-content:center;
  }
  .modal-overlay.open { display:flex; }
  .modal {
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:32px; width:500px; max-width:95vw; animation:fadeUp .3s ease;
    max-height:90vh; overflow-y:auto;
  }
  .modal-title { font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; margin-bottom:20px; }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .form-group { margin-bottom:16px; }
  .form-group label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; display:block; margin-bottom:6px; }
  .form-group select, .form-group input, .form-group textarea {
    width:100%; padding:10px 14px; background:var(--bg); border:1px solid var(--border);
    border-radius:8px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:13px; outline:none;
  }
  .form-group select:focus, .form-group input:focus, .form-group textarea:focus { border-color:var(--accent); }
  .modal-footer { display:flex; gap:10px; justify-content:flex-end; margin-top:8px; }

  /* ─── DRIVER PANEL ─── */
  .driver-status-card {
    background:linear-gradient(135deg,rgba(244,144,12,.12),rgba(224,92,0,.08));
    border:1px solid rgba(244,144,12,.3); border-radius:14px; padding:22px 24px;
    display:flex; align-items:center; gap:20px; margin-bottom:24px;
  }
  .driver-status-icon { font-size:48px; }
  .driver-trip-info { flex:1; }
  .driver-trip-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .driver-trip-value { font-family:'Rajdhani',sans-serif; font-size:26px; font-weight:700; }

  /* ─── TOAST ─── */
  #toast {
    position:fixed; bottom:28px; right:28px; z-index:9999;
    background:var(--surface); border:1px solid var(--accent); border-radius:12px;
    padding:14px 20px; display:flex; align-items:center; gap:10px;
    font-size:13px; box-shadow:0 8px 30px rgba(0,0,0,.4);
    transform:translateY(80px); opacity:0; transition:.3s;
  }
  #toast.show { transform:none; opacity:1; }
  .toast-icon { color:var(--accent); font-size:18px; }

  /* ─── RESPONSIVE ─── */
  @media(max-width:900px) {
    .stats-grid { grid-template-columns:1fr 1fr; }
    .sidebar { display:none; }
    .chat-layout { grid-template-columns:1fr; }
    .chat-sidebar { display:none; }
  }

  /* wheels eye powered row */
  .we-header {

function setRole(r, el) {
  currentRole = r;
  document.querySelectorAll('.role-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const users = {admin:'admin@ashtavinayak',driver:'driver@ashtavinayak',member:'member@ashtavinayak'};
  document.getElementById('loginUser').value = users[r];
}

function doLogin() {
  const r = roles[currentRole];
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('userName').textContent=r.name;
  document.getElementById('userRole').textContent=r.role;
  document.getElementById('userAvatar').textContent=r.avatar;
  buildNav(); buildSidebar();
  showPanel(roles[currentRole].nav[0]);
}

// ══════════════ NAV ══════════════
function buildNav() {
  const r = roles[currentRole];
  document.getElementById('topNav').innerHTML = r.nav.slice(0,6).map(p=>
    `<button class="nav-btn" onclick="showPanel('${p}')" id="tnav-${p}"><i class="fas ${navLabels[p].icon}"></i>${navLabels[p].label}</button>`
  ).join('');
}

function buildSidebar() {
  const r = roles[currentRole];
  const sections = {
    main:['dashboard','mytrip','tracking','trips'],
    fleet:['fleet','drivers','members'],
    comm:['messages'],
    finance:['expenses','reports','documents']
  };
  let html='';
  const secTitles={main:'Main',fleet:'Fleet & People',comm:'Communication',finance:'Finance & Docs'};
  for(const [sec,items] of Object.entries(sections)){
    const filtered = items.filter(i=>r.sidebar.includes(i));
    if(!filtered.length) continue;
    html+=`<div class="sidebar-section">${secTitles[sec]}</div>`;
    filtered.forEach(p=>{
      const nb = navLabels[p];
      const counts={messages:'3',trips:'5',tracking:'',fleet:'',drivers:'',dashboard:'',mytrip:'',reports:'',expenses:'',documents:'',members:''};
      html+=`<button class="sidebar-btn" onclick="showPanel('${p}')" id="snav-${p}"><i class="fas ${nb.icon}"></i>${nb.label}${counts[p]?`<span class="s-count">${counts[p]}</span>`:''}</button>`;
    });
  }
  html+=`<div style="margin-top:auto;padding-top:20px;border-top:1px solid var(--border);margin-top:20px"></div>
  <button class="sidebar-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i>Logout</button>`;
  document.getElementById('sidebar').innerHTML=html;
}

function showPanel(name) {
  currentPanel=name;
  document.querySelectorAll('.nav-btn,.sidebar-btn').forEach(b=>b.classList.remove('active'));
  const tn=document.getElementById('tnav-'+name), sn=document.getElementById('snav-'+name);
  if(tn) tn.classList.add('active');
  if(sn) sn.classList.add('active');
  const mc=document.getElementById('mainContent');
  mc.innerHTML='<div class="panel active">'+buildPanel(name)+'</div>';
  // init map after render
  if(name==='tracking') setTimeout(initMap,100);
}

function initMap() {
  const area = document.getElementById('mapArea');
  if(!area) return;
  // place truck pins
  const positions = [
    {x:28,y:42,label:'MH-12-AB-1234'},
    {x:55,y:63,label:'MH-12-CD-5678'},
    {x:72,y:30,label:'MH-04-EF-9012'},
    {x:40,y:72,label:'MH-12-AB-5555'},
  ];
  // draw fake roads
  [[0,45,100,45],[30,0,30,100],[60,0,60,100],[0,70,100,70]].forEach(([x1,y1,x2,y2])=>{
    const el=document.createElement('div');
    el.className='map-road';
    el.style.cssText=`left:${x1}%;top:${y1}%;width:${x2-x1?x2-x1+'%':'3px'};height:${y2-y1?y2-y1+'%':'3px'}`;
    area.appendChild(el);
  });
  positions.forEach(p=>{
    const pin=document.createElement('div');
    pin.className='truck-pin';
    pin.style.cssText=`left:${p.x}%;top:${p.y}%;`;
    pin.innerHTML=`<div class="truck-label">${p.label.slice(-9)}</div><div class="truck-pin-inner"><i class="fas fa-truck"></i></div>`;
    pin.onclick=()=>showToast('Truck: '+p.label);
    area.appendChild(pin);
  });
}

      </div>
      <div class="chat-messages" id="chatMsgs">${msgs}</div>

        <input class="chat-input" id="chatInput" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg()">
        <button class="btn-send" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>

function selectChat(id) {
  document.querySelectorAll('.chat-item').forEach((c,i)=>c.classList.toggle('active',chatList[i].id===id));
  const msgs=(chatMessages[id]||[{out:false,text:'No messages yet.',time:''}]).map(m=>`
    <div class="msg ${m.out?'msg-out':'msg-in'}">
      <div class="msg-bubble">${m.text}</div>
      <div class="msg-time">${m.time}</div>
    </div>`).join('');
  const el=document.getElementById('chatMsgs');
  if(el){el.innerHTML=msgs;el.scrollTop=9999;}
  const c=chatList.find(x=>x.id===id);
  showToast('Chat: '+c.name);
}

function sendMsg() {
  const inp=document.getElementById('chatInput');
  if(!inp||!inp.value.trim()) return;
  const msgs=document.getElementById('chatMsgs');
  if(msgs){
    const div=document.createElement('div');
    div.className='msg msg-out';
    div.innerHTML=`<div class="msg-bubble">${inp.value}</div><div class="msg-time">Now</div>`;
    msgs.appendChild(div);
    msgs.scrollTop=9999;
  }
  inp.value='';
}

        <button class="btn btn-ghost btn-sm" onclick="showToast('View: ${d.name}')"><i class="fas fa-eye"></i> View</button>
        <button class="btn btn-ghost btn-sm" onclick="showToast('Download: ${d.name}')"><i class="fas fa-download"></i></button>
      </div>
    </div>`).join('')}
  </div>`;
}

// ══════════════ UTILS ══════════════
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function showToast(msg) {
  const t=document.getElementById('toast');
  document.getElementById('toastMsg').textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}

// close modal on overlay click
document.addEventListener('click',e=>{
  if(e.target.classList.contains('modal-overlay')) e.target.classList.remove('open');
});
</script>
</body>
</html>
